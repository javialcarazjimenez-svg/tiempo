<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiempo</title>
<meta name="theme-color" content="#1e5fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tiempo">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg1:#3b82c4;--bg2:#1e5fa8;
  --card:rgba(255,255,255,.16);--card-strong:rgba(255,255,255,.24);
  --line:rgba(255,255,255,.22);
  --text:#fff;--muted:rgba(255,255,255,.75);
  --rain:#7cc4ff;--warn:#ffd166;--hot:#ff8a65;--cold:#9fd8ff;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%) fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  transition:background .6s;
  -webkit-font-smoothing:antialiased;
}
body.sol-dia{--bg1:#4aa3e8;--bg2:#1b6fc2}
body.nubes-dia{--bg1:#7d93ab;--bg2:#4b6280}
body.lluvia-dia{--bg1:#5c7088;--bg2:#334459}
body.tormenta-dia{--bg1:#4a4f66;--bg2:#252838}
body.nieve-dia{--bg1:#9fb3c8;--bg2:#6a819b}
body.niebla-dia{--bg1:#9aa5b1;--bg2:#6b7785}
body.sol-noche,body.nubes-noche{--bg1:#1f2a4d;--bg2:#0b1226}
body.lluvia-noche,body.tormenta-noche{--bg1:#232a3a;--bg2:#0d1119}
body.nieve-noche,body.niebla-noche{--bg1:#36425a;--bg2:#161d2c}

.app{max-width:560px;margin:0 auto;padding:12px 14px 28px}

/* Buscador */
.top{position:sticky;top:0;z-index:20;padding:calc(6px + env(safe-area-inset-top)) 14px 8px;margin:calc(-1 * env(safe-area-inset-top)) -14px 0;background:var(--bg1);transition:background .6s}
.searchbar{display:flex;gap:8px}
.search{flex:1;position:relative}
.search input{
  width:100%;height:44px;border-radius:14px;border:1px solid var(--line);
  background:rgba(0,0,0,.18);color:var(--text);font-size:16px;padding:0 14px 0 40px;
  outline:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:12px;top:12px;width:20px;height:20px;opacity:.8}
.btn{
  height:44px;min-width:44px;border-radius:14px;border:1px solid var(--line);
  background:rgba(0,0,0,.18);color:var(--text);display:grid;place-items:center;cursor:pointer;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.btn svg{width:22px;height:22px}
.btn:active{transform:scale(.95)}
.results{
  position:absolute;left:0;right:0;top:50px;background:#fff;color:#1b2533;border-radius:14px;
  overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3);display:none;max-height:60vh;overflow-y:auto;
}
.results.show{display:block}
.results button{
  display:block;width:100%;text-align:left;border:0;background:none;padding:12px 14px;
  border-bottom:1px solid #eef1f5;font-size:15px;color:inherit;cursor:pointer;
}
.results button:last-child{border-bottom:0}
.results button:active,.results button:hover{background:#f1f5fa}
.results small{display:block;color:#6b7785;font-size:12.5px;margin-top:2px}
.results .empty{padding:14px;color:#6b7785;font-size:14px}

/* Favoritos */
.favs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;white-space:nowrap;
}
.chip.on{background:#fff;color:#1b2533;border-color:#fff;font-weight:600}

/* Ahora */
.now{text-align:center;padding:14px 0 6px}
.place{font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.place .star{background:none;border:0;color:var(--text);cursor:pointer;padding:4px;display:grid}
.place .star svg{width:24px;height:24px}
.region{color:var(--muted);font-size:14px;margin-top:2px}
.now-main{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.now-main .ico{width:84px;height:84px}
.temp{font-size:76px;font-weight:200;line-height:1;letter-spacing:-2px}
.desc{font-size:18px;margin-top:2px}
.feels{color:var(--muted);font-size:15px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stat{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:17px;font-weight:600;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:4px}
.stat .v svg{width:16px;height:16px}

/* Tarjetas */
.card{background:var(--card);border-radius:var(--radius);margin-top:14px;padding:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card h2{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card h2 svg{width:15px;height:15px}

/* Horas */
.hours{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.hours::-webkit-scrollbar{display:none}
.hour{flex:none;width:58px;text-align:center;padding:4px 0}
.hour .h{font-size:13px;color:var(--muted)}
.hour .h.cur{color:var(--text);font-weight:700}
.hour .ico{width:32px;height:32px;margin:6px auto 4px;display:block}
.hour .t{font-size:16px;font-weight:600}
.hour .ap{font-size:11.5px;color:var(--muted);margin-top:1px}
.hour .p{font-size:12px;color:var(--rain);margin-top:4px;min-height:15px;font-weight:600}
.hour .w{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;justify-content:center;gap:2px}
.hour .w svg{width:11px;height:11px}

/* 7 días */
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin:-2px 0 6px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend svg{width:13px;height:13px;flex:none}
.day{border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day-row{
  display:grid;grid-template-columns:62px 38px 1fr;align-items:center;gap:8px;
  padding:11px 0;cursor:pointer;width:100%;background:none;border:0;color:inherit;text-align:left;font:inherit;
}
.dname{font-size:15.5px;font-weight:600;line-height:1.15}
.dname small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.day-row .ico{width:36px;height:36px}
.dmain{display:flex;flex-direction:column;gap:6px;min-width:0}
.trow{display:flex;align-items:center;gap:8px;font-size:15px}
.trow .mn{color:var(--muted);width:30px;text-align:right}
.trow .mx{width:30px;font-weight:600}
.tbar{flex:1;height:6px;border-radius:3px;background:rgba(0,0,0,.18);position:relative;overflow:hidden}
.tbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#7cc4ff,#ffd166,#ff8a65)}
.meta{display:flex;gap:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.meta span{display:flex;align-items:center;gap:3px;white-space:nowrap}
.meta svg{width:13px;height:13px}
.meta b{color:var(--text);font-weight:600}
.meta .rain b{color:var(--rain)}
.hi{color:var(--warn)!important}
.hot{color:var(--hot)!important}
.cold{color:var(--cold)!important}
.day-detail{display:none;padding:0 0 14px}
.day.open .day-detail{display:block}
.day.open .chev{transform:rotate(180deg)}
.chev{width:14px;height:14px;opacity:.6;transition:transform .2s;margin-left:auto}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.box{background:var(--card);border-radius:12px;padding:9px 8px}
.box .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:4px}
.box .k svg{width:12px;height:12px}
.box .v{font-size:15px;font-weight:600;margin-top:4px}
.box .s{font-size:12px;color:var(--muted);margin-top:1px}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:rgba(255,255,255,.75)}
.windline{display:grid;grid-template-columns:repeat(8,1fr);text-align:center;font-size:11.5px;color:var(--muted);margin-top:6px}
.windline svg{width:13px;height:13px;display:block;margin:0 auto 2px}
.windline b{color:var(--text);font-weight:600;display:block}
.sun{display:flex;justify-content:space-around;font-size:13px;color:var(--muted);margin-top:10px}

.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;line-height:1.6}
.foot a{color:var(--text)}
.foot button{background:none;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 14px;margin-top:8px;font-size:13px;cursor:pointer}
.msg{text-align:center;padding:60px 10px;color:var(--muted)}
.msg b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;
  animation:sp 0.8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);
  background:rgba(0,0,0,.75);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;transition:transform .3s;z-index:50;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.offline{background:rgba(0,0,0,.25);border-radius:10px;padding:6px 10px;font-size:12.5px;text-align:center;margin-top:8px;display:none}
.offline.show{display:block}
</style>
</head>
<body class="sol-dia">
<div class="app">
  <div class="top">
    <div class="searchbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Buscar ciudad o pueblo…" autocomplete="off" enterkeyhint="search">
        <div class="results" id="results"></div>
      </div>
      <button class="btn" id="locBtn" title="Mi ubicación" aria-label="Mi ubicación">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg>
      </button>
    </div>
    <div class="favs" id="favs"></div>
    <div class="offline" id="offline">Sin conexión: mostrando la última previsión guardada</div>
  </div>
  <main id="main">
    <div class="msg"><div class="spin"></div>Cargando…</div>
  </main>
  <div class="foot">
    Datos: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (modelos AEMET, ECMWF y otros)<br>
    <span id="updated"></span><br>
    <button id="refresh">Actualizar</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r0 = n => n == null || isNaN(n) ? "–" : Math.round(n);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("show"), 2600); }
function parseDay(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
const fmtWeek = new Intl.DateTimeFormat("es-ES", {weekday:"short"});
const fmtLong = new Intl.DateTimeFormat("es-ES", {weekday:"long", day:"numeric", month:"long"});
const fmtDM = new Intl.DateTimeFormat("es-ES", {day:"numeric", month:"short"});
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const DIRS = ["N","NE","E","SE","S","SO","O","NO"];
const dirName = deg => deg == null ? "" : DIRS[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
const cleanAdmin = s => (s || "").replace(/^(Provincia de |Província de |Comunidad Autónoma de |Comunidad de |Comunitat |Región de |Principado de |Comunidad Foral de |Illes |Islas )/i, "").trim();

/* ---------- Iconos ---------- */
const I = {
  drop:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c-.4 0-7 7.6-7 12a7 7 0 0014 0c0-4.4-6.6-12-7-12z"/></svg>',
  wind:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 10-3-3M3 12h16a3 3 0 11-3 3M3 16h7"/></svg>',
  therm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 14.8V5a2 2 0 10-4 0v9.8a4 4 0 104 0z"/></svg>',
  hum:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3s-6 6.6-6 11a6 6 0 0012 0c0-4.4-6-11-6-11z"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
  starOn:'<svg viewBox="0 0 24 24" fill="#ffd166" stroke="#ffd166" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>',
  starOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>'
};
// Flecha hacia donde sopla el viento (la dirección del viento indica de dónde viene)
const arrow = deg => '<svg viewBox="0 0 24 24" style="transform:rotate(' + ((deg||0)+180) + 'deg)" fill="currentColor"><path d="M12 2l6 18-6-4-6 4z"/></svg>';

const SUN_C = '<circle cx="32" cy="32" r="11" fill="#FFD43B"/><g stroke="#FFD43B" stroke-width="3.5" stroke-linecap="round"><path d="M32 8v6M32 50v6M8 32h6M50 32h6M15 15l4.2 4.2M44.8 44.8L49 49M15 49l4.2-4.2M44.8 19.2L49 15"/></g>';
const MOON_C = '<path d="M40 12a20 20 0 1012 30A16 16 0 0140 12z" fill="#F1E7B5"/>';
const CLOUD = (x,y,s,c) => '<g transform="translate('+x+' '+y+') scale('+s+')"><path d="M18 44h30a11 11 0 001.5-21.9A15 15 0 0020.6 19 12.5 12.5 0 0018 44z" fill="'+c+'"/></g>';
const SMALLSUN = '<g transform="translate(-6 -8) scale(.75)">' + SUN_C + '</g>';
const SMALLMOON = '<g transform="translate(-4 -6) scale(.7)">' + MOON_C + '</g>';
const drops = (n, col) => { let s = ""; for(let i=0;i<n;i++){ const x = 22 + i*9; s += '<path d="M'+x+' 50l-3 7" stroke="'+col+'" stroke-width="3" stroke-linecap="round"/>'; } return s; };
const flakes = n => { let s = ""; for(let i=0;i<n;i++){ const x = 22 + i*10; s += '<g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M'+x+' 49v8M'+(x-3.5)+' 51l7 4M'+(x-3.5)+' 55l7-4"/></g>'; } return s; };

function wInfo(code){
  const c = Number(code);
  if(c === 0) return {t:"Despejado", g:"sol"};
  if(c === 1) return {t:"Casi despejado", g:"sol"};
  if(c === 2) return {t:"Parcialmente nuboso", g:"nubes"};
  if(c === 3) return {t:"Cubierto", g:"nubes"};
  if(c === 45 || c === 48) return {t:"Niebla", g:"niebla"};
  if(c === 51) return {t:"Llovizna débil", g:"lluvia"};
  if(c === 53) return {t:"Llovizna", g:"lluvia"};
  if(c === 55) return {t:"Llovizna intensa", g:"lluvia"};
  if(c === 56 || c === 57) return {t:"Llovizna helada", g:"lluvia"};
  if(c === 61) return {t:"Lluvia débil", g:"lluvia"};
  if(c === 63) return {t:"Lluvia", g:"lluvia"};
  if(c === 65) return {t:"Lluvia fuerte", g:"lluvia"};
  if(c === 66 || c === 67) return {t:"Lluvia helada", g:"lluvia"};
  if(c === 71) return {t:"Nieve débil", g:"nieve"};
  if(c === 73) return {t:"Nieve", g:"nieve"};
  if(c === 75) return {t:"Nieve fuerte", g:"nieve"};
  if(c === 77) return {t:"Granizo fino", g:"nieve"};
  if(c === 80) return {t:"Chubascos débiles", g:"lluvia"};
  if(c === 81) return {t:"Chubascos", g:"lluvia"};
  if(c === 82) return {t:"Chubascos fuertes", g:"lluvia"};
  if(c === 85 || c === 86) return {t:"Chubascos de nieve", g:"nieve"};
  if(c === 95) return {t:"Tormenta", g:"tormenta"};
  if(c === 96 || c === 99) return {t:"Tormenta con granizo", g:"tormenta"};
  return {t:"—", g:"nubes"};
}

function icon(code, day){
  const c = Number(code), d = day !== false;
  let b;
  if(c === 0) b = d ? SUN_C : MOON_C;
  else if(c === 1 || c === 2) b = (d ? SMALLSUN : SMALLMOON) + CLOUD(4, 6, c === 1 ? .8 : .95, "#fff");
  else if(c === 3) b = CLOUD(-6, -2, .85, "#c9d3de") + CLOUD(4, 6, .95, "#f2f5f8");
  else if(c === 45 || c === 48) b = CLOUD(2, -6, .95, "#e6ebf0") + '<g stroke="#e6ebf0" stroke-width="3.5" stroke-linecap="round"><path d="M12 46h40M18 54h32"/></g>';
  else if(c >= 51 && c <= 57) b = CLOUD(2, -6, .95, "#eef2f6") + drops(3, "#9bd2ff");
  else if((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) {
    const sun = (c >= 80 && d) ? SMALLSUN : "";
    b = sun + CLOUD(2, -6, .95, c === 65 || c === 82 ? "#b8c3cf" : "#e2e8ee") + drops(c === 61 || c === 80 ? 3 : 4, "#5fb4ff");
  }
  else if((c >= 71 && c <= 77) || c === 85 || c === 86) b = CLOUD(2, -6, .95, "#eef2f6") + flakes(3);
  else if(c >= 95) b = CLOUD(2, -8, .95, "#9aa6b4") + '<path d="M34 40l-7 11h6l-4 10 11-14h-6l4-7z" fill="#FFD43B"/>' + drops(2, "#5fb4ff");
  else b = CLOUD(2, 0, .95, "#e2e8ee");
  return '<svg class="ico" viewBox="0 0 64 64" aria-hidden="true">' + b + '</svg>';
}

/* ---------- Estado ---------- */
let favs = store.get("tiempo.favs", []);
let current = store.get("tiempo.last", null);
let data = null;

/* ---------- Buscador ---------- */
const q = $("#q"), results = $("#results");
let searchT = null, searchId = 0, lastResults = [];
q.addEventListener("input", () => {
  clearTimeout(searchT);
  const term = q.value.trim();
  if(term.length < 2){ results.classList.remove("show"); return; }
  searchT = setTimeout(() => doSearch(term), 300);
});
q.addEventListener("keydown", e => {
  if(e.key === "Enter"){ e.preventDefault(); if(lastResults[0]) pick(lastResults[0]); }
  if(e.key === "Escape"){ results.classList.remove("show"); q.blur(); }
});
document.addEventListener("click", e => { if(!e.target.closest(".search")) results.classList.remove("show"); });

async function doSearch(term){
  const id = ++searchId;
  try{
    const url = "https://geocoding-api.open-meteo.com/v1/search?count=10&language=es&format=json&countryCode=ES&name=" + encodeURIComponent(term);
    const r = await fetch(url);
    const j = await r.json();
    if(id !== searchId) return;
    lastResults = (j.results || []).map(x => ({
      name: x.name, lat: x.latitude, lon: x.longitude,
      prov: cleanAdmin(x.admin2), ccaa: cleanAdmin(x.admin1), elev: x.elevation
    }));
    results.innerHTML = lastResults.length
      ? lastResults.map((x, i) => '<button data-i="'+i+'">' + esc(x.name) + '<small>' + esc([x.prov, x.ccaa].filter((v, k, a) => v && a.indexOf(v) === k).join(" · ")) + '</small></button>').join("")
      : '<div class="empty">No se ha encontrado «' + esc(term) + '». Prueba sin tildes o con otro nombre.</div>';
    results.classList.add("show");
  }catch(e){
    if(id !== searchId) return;
    results.innerHTML = '<div class="empty">No se puede buscar sin conexión.</div>';
    results.classList.add("show");
  }
}
results.addEventListener("click", e => {
  const b = e.target.closest("button[data-i]");
  if(b) pick(lastResults[+b.dataset.i]);
});
function pick(p){
  results.classList.remove("show");
  q.value = ""; q.blur();
  load({name:p.name, lat:p.lat, lon:p.lon, prov:p.prov, ccaa:p.ccaa});
}

/* ---------- Ubicación ---------- */
$("#locBtn").addEventListener("click", () => {
  if(!navigator.geolocation){ toast("Tu navegador no permite la ubicación"); return; }
  toast("Buscando tu ubicación…");
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = +pos.coords.latitude.toFixed(4), lon = +pos.coords.longitude.toFixed(4);
    let place = {name:"Mi ubicación", lat, lon, prov:"", ccaa:""};
    try{
      const r = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=es&latitude=" + lat + "&longitude=" + lon);
      const j = await r.json();
      place.name = j.city || j.locality || "Mi ubicación";
      const adm = (j.localityInfo && j.localityInfo.administrative) || [];
      const prov = adm.find(a => a.adminLevel === 6), ccaa = adm.find(a => a.adminLevel === 4);
      place.prov = cleanAdmin(prov ? prov.name : "");
      place.ccaa = cleanAdmin(ccaa ? ccaa.name : j.principalSubdivision);
    }catch(e){}
    load(place);
  }, err => {
    toast(err.code === 1 ? "Permiso de ubicación denegado" : "No se ha podido obtener la ubicación");
  }, {enableHighAccuracy:false, timeout:12000, maximumAge:600000});
});

/* ---------- Favoritos ---------- */
const sameP = (a, b) => a && b && Math.abs(a.lat - b.lat) < 0.01 && Math.abs(a.lon - b.lon) < 0.01;
const isFav = p => favs.some(f => sameP(f, p));
function toggleFav(){
  if(!current) return;
  if(isFav(current)){ favs = favs.filter(f => !sameP(f, current)); toast("Quitado de favoritos"); }
  else { favs.push({name:current.name, lat:current.lat, lon:current.lon, prov:current.prov, ccaa:current.ccaa}); toast("Añadido a favoritos"); }
  store.set("tiempo.favs", favs);
  renderFavs(); renderStar();
}
function renderFavs(){
  const el = $("#favs");
  el.innerHTML = favs.map((f, i) => '<button class="chip' + (sameP(f, current) ? " on" : "") + '" data-f="' + i + '">' + esc(f.name) + '</button>').join("");
  el.style.display = favs.length ? "flex" : "none";
}
$("#favs").addEventListener("click", e => {
  const b = e.target.closest("[data-f]");
  if(b) load(favs[+b.dataset.f]);
});
function renderStar(){
  const s = $("#star");
  if(s) s.innerHTML = isFav(current) ? I.starOn : I.starOff;
}

/* ---------- Carga de la previsión ---------- */
const DAILY = "weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,sunrise,sunset,uv_index_max";
const HOURLY = "temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,is_day";
const CURRENT = "temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,is_day,precipitation";

async function load(place){
  current = place;
  store.set("tiempo.last", place);
  renderFavs();
  if(!data || !sameP(data.place, place)) $("#main").innerHTML = '<div class="msg"><div class="spin"></div>Cargando ' + esc(place.name) + '…</div>';
  const url = "https://api.open-meteo.com/v1/forecast?timezone=Europe%2FMadrid&forecast_days=7&wind_speed_unit=kmh"
    + "&latitude=" + place.lat + "&longitude=" + place.lon
    + "&daily=" + DAILY + "&hourly=" + HOURLY + "&current=" + CURRENT;
  try{
    const r = await fetch(url, {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    data = {place, w:j, at:Date.now()};
    store.set("tiempo.cache", data);
    $("#offline").classList.remove("show");
  }catch(e){
    const c = store.get("tiempo.cache", null);
    if(c && sameP(c.place, place)){ data = c; $("#offline").classList.add("show"); }
    else {
      $("#main").innerHTML = '<div class="msg"><b>No se ha podido cargar el tiempo</b>Comprueba la conexión y vuelve a intentarlo.</div>';
      return;
    }
  }
  render();
}
$("#refresh").addEventListener("click", () => { if(current) load(current); });
document.addEventListener("visibilitychange", () => {
  // Al volver a la app, refresca si los datos tienen más de 20 minutos
  if(document.visibilityState === "visible" && data && Date.now() - data.at > 20*60*1000) load(current);
});

/* ---------- Pintado ---------- */
function render(){
  const w = data.w, p = data.place, c = w.current, d = w.daily, h = w.hourly;
  const info = wInfo(c.weather_code), isDay = c.is_day === 1;
  document.body.className = info.g + (isDay ? "-dia" : "-noche");

  // Índice de la hora actual dentro de los datos horarios
  const nowKey = c.time.slice(0, 13);
  let hi = h.time.findIndex(t => t.slice(0, 13) === nowKey);
  if(hi < 0) hi = 0;

  const region = [p.prov, p.ccaa].filter((v, k, a) => v && a.indexOf(v) === k).join(" · ");
  const feelCls = c.apparent_temperature >= 35 ? "hot" : c.apparent_temperature <= 0 ? "cold" : "";
  const gustCls = c.wind_gusts_10m >= 50 ? "hi" : "";
  const rainNow = h.precipitation_probability[hi];

  let html = '<section class="now">'
    + '<div class="place"><span>' + esc(p.name) + '</span><button class="star" id="star" aria-label="Favorito"></button></div>'
    + (region ? '<div class="region">' + esc(region) + '</div>' : '')
    + '<div class="now-main">' + icon(c.weather_code, isDay) + '<div class="temp">' + r0(c.temperature_2m) + '°</div></div>'
    + '<div class="desc">' + info.t + '</div>'
    + '<div class="feels">Sensación térmica <b class="' + feelCls + '">' + r0(c.apparent_temperature) + '°</b> · Máx ' + r0(d.temperature_2m_max[0]) + '° Mín ' + r0(d.temperature_2m_min[0]) + '°</div>'
    + '<div class="stats">'
    +   '<div class="stat"><div class="k">Lluvia</div><div class="v" style="color:var(--rain)">' + I.drop + r0(rainNow) + '%</div></div>'
    +   '<div class="stat"><div class="k">Viento</div><div class="v">' + arrow(c.wind_direction_10m) + r0(c.wind_speed_10m) + '</div></div>'
    +   '<div class="stat"><div class="k">Rachas</div><div class="v ' + gustCls + '">' + r0(c.wind_gusts_10m) + '</div></div>'
    +   '<div class="stat"><div class="k">Humedad</div><div class="v">' + r0(c.relative_humidity_2m) + '%</div></div>'
    + '</div></section>';

  // Próximas 24 horas
  html += '<section class="card"><h2>' + I.clock + 'Próximas 24 horas</h2><div class="hours">';
  for(let i = hi; i < Math.min(hi + 25, h.time.length); i++){
    const pr = h.precipitation_probability[i];
    html += '<div class="hour"><div class="h' + (i === hi ? ' cur' : '') + '">' + (i === hi ? "Ahora" : h.time[i].slice(11, 13) + "h") + '</div>'
      + icon(h.weather_code[i], h.is_day[i] === 1)
      + '<div class="t">' + r0(h.temperature_2m[i]) + '°</div>'
      + '<div class="ap" title="Sensación térmica">ST ' + r0(h.apparent_temperature[i]) + '°</div>'
      + '<div class="p">' + (pr >= 5 ? r0(pr) + '%' : '') + '</div>'
      + '<div class="w">' + arrow(h.wind_direction_10m[i]) + r0(h.wind_speed_10m[i]) + '</div></div>';
  }
  html += '</div></section>';

  // 7 días
  const allMin = Math.min(...d.temperature_2m_min), allMax = Math.max(...d.temperature_2m_max);
  const span = Math.max(1, allMax - allMin);
  html += '<section class="card"><h2>' + I.cal + 'Próximos 7 días</h2>'
    + '<div class="legend"><span style="color:var(--rain)">' + I.drop + ' prob. lluvia</span><span>' + I.wind + ' viento / rachas km/h</span><span>' + I.therm + ' sensación térmica</span></div>';
  d.time.forEach((t, i) => {
    const dt = parseDay(t);
    const name = i === 0 ? "Hoy" : i === 1 ? "Mañana" : cap(fmtWeek.format(dt).replace(".", ""));
    const left = (d.temperature_2m_min[i] - allMin) / span * 100, width = (d.temperature_2m_max[i] - d.temperature_2m_min[i]) / span * 100;
    const pr = d.precipitation_probability_max[i], mm = d.precipitation_sum[i];
    const fmx = d.apparent_temperature_max[i], fmn = d.apparent_temperature_min[i];
    html += '<div class="day" data-d="' + i + '">'
      + '<button class="day-row" aria-expanded="false">'
      +   '<div class="dname">' + name + '<small>' + fmtDM.format(dt) + '</small></div>'
      +   icon(d.weather_code[i], true)
      +   '<div class="dmain">'
      +     '<div class="trow"><span class="mn">' + r0(d.temperature_2m_min[i]) + '°</span><div class="tbar"><i style="left:' + left.toFixed(1) + '%;width:' + Math.max(4, width).toFixed(1) + '%"></i></div><span class="mx">' + r0(d.temperature_2m_max[i]) + '°</span>' + I.chev + '</div>'
      +     '<div class="meta">'
      +       '<span class="rain" title="Probabilidad de lluvia">' + I.drop + '<b class="' + (pr >= 60 ? "hi" : "") + '">' + r0(pr) + '%</b>' + (mm >= 0.1 ? ' ' + mm.toFixed(1).replace(".", ",") + ' mm' : '') + '</span>'
      +       '<span title="Viento máximo / rachas">' + arrow(d.wind_direction_10m_dominant[i]) + '<b>' + r0(d.wind_speed_10m_max[i]) + '</b>/<b class="' + (d.wind_gusts_10m_max[i] >= 50 ? "hi" : "") + '">' + r0(d.wind_gusts_10m_max[i]) + '</b></span>'
      +       '<span title="Sensación térmica mín / máx">' + I.therm + '<b class="' + (fmn <= 0 ? "cold" : "") + '">' + r0(fmn) + '°</b>/<b class="' + (fmx >= 35 ? "hot" : "") + '">' + r0(fmx) + '°</b></span>'
      +     '</div>'
      +   '</div>'
      + '</button>'
      + '<div class="day-detail"></div>'
      + '</div>';
  });
  html += '</section>';

  $("#main").innerHTML = html;
  renderStar();
  $("#star").addEventListener("click", toggleFav);
  const at = new Date(data.at);
  $("#updated").textContent = "Actualizado: " + at.toLocaleString("es-ES", {weekday:"short", hour:"2-digit", minute:"2-digit"});
}

// Desplegar un día
$("#main").addEventListener("click", e => {
  const row = e.target.closest(".day-row");
  if(!row) return;
  const day = row.parentElement, i = +day.dataset.d;
  const open = !day.classList.contains("open");
  day.classList.toggle("open", open);
  row.setAttribute("aria-expanded", open);
  if(open){
    const det = day.querySelector(".day-detail");
    if(!det.innerHTML) det.innerHTML = dayDetail(i);
  }
});

function dayDetail(i){
  const d = data.w.daily, h = data.w.hourly;
  const start = h.time.findIndex(t => t.startsWith(d.time[i]));
  const idx = []; for(let k = start; k < start + 24 && k < h.time.length; k++) idx.push(k);
  const dt = parseDay(d.time[i]);
  const hm = s => s ? s.slice(11, 16) : "–";
  const maxH = (arr) => { let b = idx[0]; idx.forEach(k => { if(arr[k] > arr[b]) b = k; }); return b; };
  const rainH = idx.filter(k => h.precipitation_probability[k] >= 40);
  const rainTxt = rainH.length ? "de " + h.time[rainH[0]].slice(11, 13) + "h a " + (+h.time[rainH[rainH.length - 1]].slice(11, 13) + 1) + "h" : "poco probable";
  const gk = maxH(h.wind_gusts_10m);

  let s = '<div style="font-size:13px;color:var(--muted);margin-bottom:10px">' + cap(fmtLong.format(dt)) + ' · ' + wInfo(d.weather_code[i]).t + '</div>'
    + '<div class="boxes">'
    +   '<div class="box"><div class="k">' + I.drop + 'Lluvia</div><div class="v" style="color:var(--rain)">' + r0(d.precipitation_probability_max[i]) + '%</div><div class="s">' + (d.precipitation_sum[i] || 0).toFixed(1).replace(".", ",") + ' mm · ' + rainTxt + '</div></div>'
    +   '<div class="box"><div class="k">' + I.wind + 'Viento</div><div class="v">' + r0(d.wind_speed_10m_max[i]) + ' km/h ' + dirName(d.wind_direction_10m_dominant[i]) + '</div><div class="s">Rachas ' + r0(d.wind_gusts_10m_max[i]) + ' a las ' + h.time[gk].slice(11, 13) + 'h</div></div>'
    +   '<div class="box"><div class="k">' + I.therm + 'Sensación</div><div class="v">' + r0(d.apparent_temperature_min[i]) + '° / ' + r0(d.apparent_temperature_max[i]) + '°</div><div class="s">Real ' + r0(d.temperature_2m_min[i]) + '° / ' + r0(d.temperature_2m_max[i]) + '°</div></div>'
    + '</div>';

  s += chart(idx);

  // Viento cada 3 horas
  s += '<div class="windline">';
  for(let n = 0; n < 8; n++){
    const k = idx[n * 3]; if(k == null) break;
    s += '<div>' + arrow(h.wind_direction_10m[k]) + '<b>' + r0(h.wind_speed_10m[k]) + '</b><span class="' + (h.wind_gusts_10m[k] >= 50 ? "hi" : "") + '">' + r0(h.wind_gusts_10m[k]) + '</span><br>' + h.time[k].slice(11, 13) + 'h</div>';
  }
  s += '</div><div style="text-align:center;font-size:11px;color:var(--muted);margin-top:4px">Viento medio y rachas (km/h), cada 3 horas</div>';
  s += '<div class="sun"><span>☀ Sale ' + hm(d.sunrise[i]) + '</span><span>Se pone ' + hm(d.sunset[i]) + '</span><span>UV ' + r0(d.uv_index_max[i]) + '</span></div>';
  return s;
}

// Gráfico por horas: temperatura (línea), sensación térmica (discontinua) y probabilidad de lluvia (barras)
function chart(idx){
  const h = data.w.hourly, W = 340, H = 150, padL = 26, padR = 8, top = 12, bot = 22;
  const cw = W - padL - padR, ch = H - top - bot;
  const T = idx.map(k => h.temperature_2m[k]), A = idx.map(k => h.apparent_temperature[k]), P = idx.map(k => h.precipitation_probability[k] || 0);
  let lo = Math.floor(Math.min(...T, ...A)) - 1, hi = Math.ceil(Math.max(...T, ...A)) + 1;
  if(hi - lo < 6){ const m = (hi + lo) / 2; lo = Math.floor(m - 3); hi = Math.ceil(m + 3); }
  const x = n => padL + (n + .5) * cw / idx.length;
  const y = v => top + (hi - v) / (hi - lo) * ch;
  const line = arr => arr.map((v, n) => (n ? "L" : "M") + x(n).toFixed(1) + " " + y(v).toFixed(1)).join("");
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gráfico por horas">';
  // Barras de lluvia (escala 0–100 %)
  const bw = cw / idx.length * .7;
  P.forEach((p, n) => { if(p > 0){ const bh = p / 100 * ch; s += '<rect x="' + (x(n) - bw/2).toFixed(1) + '" y="' + (top + ch - bh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="1.5" fill="#7cc4ff" opacity=".45"/>'; } });
  // Rejilla de temperatura
  const step = Math.max(2, Math.ceil((hi - lo) / 4 / 2) * 2);
  for(let v = Math.ceil(lo / step) * step; v <= hi; v += step){
    s += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="rgba(255,255,255,.15)"/>'
      + '<text x="' + (padL - 4) + '" y="' + (y(v) + 3).toFixed(1) + '" text-anchor="end">' + v + '°</text>';
  }
  s += '<path d="' + line(A) + '" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round"/>';
  s += '<path d="' + line(T) + '" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  for(let n = 0; n < idx.length; n += 3) s += '<text x="' + x(n).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + h.time[idx[n]].slice(11, 13) + 'h</text>';
  s += '</svg>';
  s += '<div class="legend" style="margin-top:4px;justify-content:center"><span><i style="background:#fff"></i>Temperatura</span><span><i style="background:#ffd166"></i>Sensación térmica</span><span><i style="background:#7cc4ff;opacity:.7"></i>Prob. lluvia</span></div>';
  return s;
}

/* ---------- Inicio ---------- */
renderFavs();
const cached = store.get("tiempo.cache", null);
if(current && cached && sameP(cached.place, current)){ data = cached; render(); }
load(current || {name:"Madrid", lat:40.4165, lon:-3.7026, prov:"Madrid", ccaa:"Madrid"});

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
